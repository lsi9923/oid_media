name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 수동 실행도 허용한다
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한만 준다
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 새 푸시가 오면 진행 중인 것을 취소하지 않고 큐에 넣는다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
